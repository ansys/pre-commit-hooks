ci:
    autofix_commit_msg: 'chore: auto fixes from pre-commit hooks'
    autoupdate_commit_msg: 'chore: pre-commit automatic update'
    autoupdate_schedule: weekly

repos:

- repo: https://github.com/psf/black-pre-commit-mirror
  rev: a5439e9af2ff9371297bb1a76a01b8ad17989b88  # frozen: 26.10.1
  hooks:
  - id: black

- repo: https://github.com/pycqa/isort
  rev: 9f905615631c545f5aea2516508109350d1d2f7d  # frozen: 9.0.2
  hooks:
  - id: isort

- repo: https://github.com/PyCQA/flake8
  rev: cfbbfdeb2391c14a37e101e92a77f54f329e1726  # frozen: 7.4.1
  hooks:
  - id: flake8

- repo: https://github.com/codespell-project/codespell
  rev: 57b21406f092110c18776e39b0bda50d37c945c8  # frozen: v2.4.3
  hooks:
  - id: codespell
    additional_dependencies:
      - tomli

- repo: https://github.com/pycqa/pydocstyle
  rev: 07f6707e2c5612960347f7c00125620457f490a7  # frozen: 6.3.0
  hooks:
  - id: pydocstyle
    additional_dependencies: [toml]
    exclude: "tests/"

- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
  hooks:
  - id: check-merge-conflict
  - id: debug-statements
  - id: check-yaml
    exclude: templates/dependabot.yml
  - id: trailing-whitespace

- repo: https://github.com/python-jsonschema/check-jsonschema
  rev: 4f85d46a92dc17713078e5de73f8a13190edf6fc  # frozen: 0.38.2
  hooks:
    - id: check-github-workflows

- repo: https://github.com/ansys/pre-commit-hooks
  rev: 55c5b6a5439abd847613579c6924da750e8b78b2  # frozen: v0.8.0
  hooks:
  - id: add-license-headers
    args:
    - --start_year=2023
    exclude: |
        (?x)^(
            tests/test_add_license_headers_files/bad_chars.py |
            tests/test_add_license_headers_files/index_error.scss
        )$
  - id: tech-review
    args:
    - --product=pre_commit_hooks
    - --non_compliant_name

- repo: local
  hooks:
   - id: hashed-pre-commit
     name: Hashed Pre-Commit Versions
     entry: hashed-pre-commit
     language: python
     files: '(\.pre-commit-config\.yaml)'
     additional_dependencies:
       - ansys-pre-commit-hooks@git+https://github.com/ansys/pre-commit-hooks@feat/check-precommit
